name: Capital Forge CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CF-051 navigation audit
        shell: bash
        run: |
          echo '=== window.location.assign ==='
          grep -RIn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' 'window\.location\.assign' app || true
          echo '=== location.assign ==='
          grep -RIn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' -E '(^|[^A-Za-z0-9_])location\.assign' app || true
          echo '=== client navigation imports ==='
          grep -RIn --include='*.tsx' -E 'next/(navigation|link)' app || true
      - run: npm install
      - run: npm run validate:content
      - name: TypeScript baseline (known pre-existing errors)
        continue-on-error: true
        run: npm run typecheck
      - run: npm run build
